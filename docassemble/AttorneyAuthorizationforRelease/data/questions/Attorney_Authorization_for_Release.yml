metadata:
  title: Give your lawyer permission to get records about your case
  short title: Lawyer records release
  description: Prepare the Massachusetts Volunteer Lawyers Project client authorization
    for release of information. Name your lawyer and the dispute, then print a form
    for you and a witness to sign.
  can_I_use_this_form: Use this form when your Massachusetts lawyer asks for this
    general client authorization. It authorizes your lawyer to act as your legal counsel
    and gives broad permission to obtain records about
    the dispute you name for one year. Ask your lawyer about a narrower release or
    a special medical-records form if needed.
  before_you_start: Have your lawyer’s full name and Massachusetts office address,
    the name of the person or organization involved in your dispute, and a witness
    for signing after you print.
  when_you_are_finished: Read the authorization, print it, and sign and date it with
    a witness. Send it to your lawyer. The tool does not find a lawyer, send the form,
    or release records by itself.
