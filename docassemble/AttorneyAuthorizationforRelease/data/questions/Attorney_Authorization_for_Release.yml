code: |
  AL_DEFAULT_COUNTRY = "US"
  AL_DEFAULT_STATE = "MA"
  al_form_type = "letter"
---
features:
  cache documents: False
  tagged pdf: True
---
objects:
  - users: ALPeopleList.using(target_number=1)
---
objects:
  - lawyer: ALIndividual
---
sections:
  - review_authorization: Review your answers
---
initial: True
code: |
  # Rebuild downloads after an answer is edited.
  undefine("client_authorization_document")
---
mandatory: True
code: |
  al_intro_screen
  authorization_intro
  if not lawyer_requested_form:
    ask_your_lawyer
  users[0].name.first
  lawyer.name.first
  dispute_with
  witness_name
  authorization_preview
  authorization_download
---
id: authorization introduction
continue button field: authorization_intro
question: |
  Let your lawyer request records
subquestion: |
  This form gives your named lawyer and the legal staff they choose permission
  to get records about your dispute. It also authorizes them to act as your legal
  counsel. The permission lasts for one year after you sign.

  This is broad permission. Ask your lawyer before signing if you want to limit
  the records they can get. Some records need a different release form.

  You and a witness will sign the printed form. You do not need a witness here now.
---
id: lawyer requested form
question: |
  Did your lawyer ask you to complete this authorization?
fields:
  - My lawyer asked me to use this form: lawyer_requested_form
    datatype: yesnoradio
---
id: talk with lawyer
event: ask_your_lawyer
question: |
  Check with your lawyer first
subquestion: |
  This form is for an existing lawyer-client relationship. It does not find
  or hire a lawyer for you. Ask your lawyer which release form to use.

  [Find legal help in Massachusetts](https://masslrf.org/).
buttons:
  - Start over: restart
  - Leave: exit
---
id: lawyer details
question: |
  Who is your lawyer?
fields:
  - Lawyer or legal aid organization's name: lawyer.name.first
  - Street address: attorneys_address
  - City or town: attorneys_city
subquestion: |
  Use the Massachusetts office address your lawyer gave you.
  Include the suite number with the street address.
---
id: dispute details
question: |
  Who is your dispute with?
subquestion: |
  Write the full name of the person or organization. You may list more than one.
  This limits the authorization to records about the dispute with those you name.
fields:
  - Names: dispute_with
    input type: area
---
id: witness name
question: |
  Do you know who will witness your signature?
subquestion: |
  You can leave this blank and write the witness's name on the printed form.
  The witness needs to watch you sign and then sign the witness line.
fields:
  - Witness's full name: witness_name
    required: False
---
id: authorization preview
question: |
  Review the authorization
subquestion: |
  Read the whole form before signing. Check your name, the lawyer, and the dispute.
  The signature and date lines stay blank for you and your witness to fill in together.

  ${ client_authorization_document }

  ${ action_button_html(url_action('review_authorization'), label='Edit answers') }
continue button field: authorization_preview
---
id: review authorization
event: review_authorization
question: |
  Review your answers
review:
  - Edit: users[0].name.first
    button: |
      Your name: ${ users[0] }
  - Edit: lawyer.name.first
    button: |
      Lawyer: ${ lawyer.name.first }
      ${ attorneys_address }, ${ attorneys_city }, Massachusetts
  - Edit: dispute_with
    button: |
      Dispute with: ${ dispute_with }
  - Edit: witness_name
    button: |
      Witness: ${ witness_name or 'Write the name after printing' }
---
attachment:
  variable name: client_authorization_document
  name: Client authorization for your lawyer
  filename: client_authorization_for_lawyer
  docx template file: Attorney_Authorization_for_Release_English.docx
---
id: authorization download
event: authorization_download
question: |
  Download and sign your authorization
subquestion: |
  1. Download, read, and print the form.
  2. Sign and date it while a witness watches. Have the witness sign and date it too.
  3. Send the signed form to your lawyer using the contact method they gave you.
     Keep a copy for yourself.

  This tool does not send the form. Ask your lawyer before signing if you want
  to limit the permission or if you do not understand any part of it.

  ${ action_button_html(url_action('review_authorization'), label='Edit answers') }
attachment code: client_authorization_document
