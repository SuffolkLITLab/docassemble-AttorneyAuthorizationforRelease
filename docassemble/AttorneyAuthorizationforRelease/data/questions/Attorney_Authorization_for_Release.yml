metadata:
  title: Give your lawyer permission to get records about your case
  short title: Lawyer records release
  description: |
    Make a form to let your lawyer act for you and get records about your case.
    Use it if your lawyer in Massachusetts asked you to fill it out.
    Print the form for you and a witness to sign. A witness is someone who
    watches you sign, then signs too.
  can_I_use_this_form: |
    Use this form if your lawyer asked you for it. It gives your lawyer and
    their legal staff permission to act for you and get records about the
    problem you name. This permission lasts for one year from the date you sign.
    Ask your lawyer if you want to limit which records they can get.
    Some records, such as medical records, may need a different form.
  before_you_start: |
    Have your lawyer's name and office address in Massachusetts.
    Know who your legal problem is with. You will need a witness when you
    sign the printed form. You do not need one here now.
  when_you_are_finished: |
    Read and print the form. Sign and date it with a witness.
    Send it to your lawyer. This tool does not find a lawyer for you,
    send the form, or share your records.
