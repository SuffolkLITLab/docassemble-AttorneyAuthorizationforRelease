---
id: authorization introduction
continue button field: authorization_intro
question: |
  Let your lawyer get records
subquestion: |
  This form gives your lawyer and their legal staff permission to get records
  about your legal problem. It also lets them act for you. The form
  calls this acting as your "legal counsel." The permission lasts for one year
  from the date you sign.

  They can ask for any records about the problem you name. Talk with your
  lawyer before you sign if you want to limit which records they can get.
  Some records, such as medical records, may need a different form.

  You and a witness will sign the printed form. A witness is someone who
  watches you sign, then signs too. You do not need a witness here now.

  The form is called an "authorization" because it gives someone permission
  to act for you. A "release" lets someone share records.
---
id: lawyer requested form
question: |
  Did your lawyer ask you to fill out this form?
fields:
  - My lawyer asked me to use this form: lawyer_requested_form
    datatype: yesnoradio
---
id: talk with lawyer
event: ask_your_lawyer
question: |
  Check with your lawyer first
subquestion: |
  Use this form only if you already have a lawyer. It does not find
  or hire a lawyer for you. Ask your lawyer which form to use.

  [Find legal help in Massachusetts](https://masslrf.org/).
buttons:
  - Start over: restart
  - Leave: exit
---
id: lawyer details
question: |
  Who is your lawyer?
fields:
  - Name of your lawyer or legal aid office: lawyer.name.first
  - Street address: attorneys_address
  - City or town: attorneys_city
subquestion: |
  Use the office address in Massachusetts that your lawyer gave you.
  Add the room or suite number with the street address.
---
id: dispute details
question: |
  Who is your legal problem with?
subquestion: |
  Write the full name of the person, business, or group. You may list more than one.
  The form calls this your "dispute." It means the problem or disagreement
  you want help with. This form only covers records about that problem.
fields:
  - Names: dispute_with
    input type: area
---
id: witness name
question: |
  Do you know who will watch you sign?
subquestion: |
  You can leave this blank and write the witness's name on the printed form.
  They must watch you sign, then sign the witness line.
fields:
  - Witness's full name: witness_name
    required: False
---
id: authorization preview
question: |
  Review your form
subquestion: |
  Read the whole form before you sign. Check your name, the lawyer, and who
  your legal problem is with. You and your witness will fill in the blank
  lines when you sign and date the form.

  ${ client_authorization_document }

  ${ action_button_html(url_action('review_authorization'), label='Edit answers') }
continue button field: authorization_preview
---
id: review authorization
event: review_authorization
question: |
  Review your answers
review:
  - Edit: users[0].name.first
    button: |
      Your name: ${ users[0] }
  - Edit: lawyer.name.first
    button: |
      Lawyer: ${ lawyer.name.first }
      ${ attorneys_address }, ${ attorneys_city }, Massachusetts
  - Edit: dispute_with
    button: |
      Legal problem with: ${ dispute_with }
  - Edit: witness_name
    button: |
      Witness: ${ witness_name or 'Write the name after printing' }
---
attachment:
  variable name: client_authorization_document
  name: Client authorization for your lawyer
  filename: client_authorization_for_lawyer
  docx template file: Attorney_Authorization_for_Release_English.docx
---
id: authorization download
event: authorization_download
question: |
  Download and sign your form
subquestion: |
  1. Download, read, and print the form.
  2. Sign and date it while a witness watches. Have them sign and date it too.
  3. Send the signed form to your lawyer in the way they asked you to.
     Keep a copy for yourself.

  This tool does not send the form. Talk with your lawyer before you sign
  if you want to limit what it allows. Ask them about any part you do not understand.

  ${ action_button_html(url_action('review_authorization'), label='Edit answers') }
attachment code: client_authorization_document
